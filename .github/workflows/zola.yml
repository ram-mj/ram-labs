name: Zola

on:
    push:
        branches: [main]
    workflow_dispatch:

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Build and deploy
              uses: shalzz/zola-deploy-action@0.22.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
